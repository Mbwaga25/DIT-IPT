<body>
    <input id="num1"><br>
    <input id="num2"><br>

    <button onclick="result.innerHTML=Number(num1.value)+Number(num2.value)">+</button>
    <button onclick="result.innerHTML=Number(num1.value)-Number(num2.value)">-</button>
    <button onclick="result.innerHTML=Number(num1.value)*Number(num2.value)">*</button>
    <button onclick="result.innerHTML=Number(num1.value)/Number(num2.value)">/</button>

    <h3>result</h3>
